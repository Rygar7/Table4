<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePath AI</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header>
    <div class="logo">LifePath AI</div>

    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Home</a>
      <a href="/money" class="{{ 'active' if request.url.path == '/money' else '' }}">My Money</a>
      <a href="/goals" class="{{ 'active' if request.url.path == '/goals' else '' }}">Goals</a>
      <a href="/accounts" class="{{ 'active' if request.url.path == '/accounts' else '' }}">Accounts &amp; Credit</a>
      <a href="/stocks" class="{{ 'active' if request.url.path == '/stocks' else '' }}">Stocks</a>
      <a href="/ideas" class="{{ 'active' if request.url.path == '/ideas' else '' }}">Suggested Trades</a>
      <a href="/nemotron" class="{{ 'active' if request.url.path == '/nemotron' else '' }}">My AI Plan</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
