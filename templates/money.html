{% extends "base.html" %}

{% block content %}
<section class="welcome">
  <div>
    <p class="label">YOUR FINANCIAL DETAILS</p>
    <h1>My Money</h1>
    <p>Add the information the simulator needs.</p>
  </div>
</section>

<section class="panel">
  <p class="label">INCOME AND TAXES</p>
  <h2>Your monthly information</h2>

  <form id="income-form">
    <p>
      <label>Monthly gross income</label><br>
      <input name="gross_income" type="number" min="0" step="0.01" placeholder="Enter amount" required>
    </p>

    <p>
      <label>Income-tax estimate (%)</label><br>
      <input name="income_tax_rate" type="number" min="0" max="100" step="0.01" placeholder="Enter rate" value="0">
    </p>

    <p>
      <label>Payroll-tax estimate (%)</label><br>
      <input name="payroll_tax_rate" type="number" min="0" max="100" step="0.01" placeholder="Enter rate" value="0">
    </p>

    <p>
      <label>Sales tax / VAT estimate (%)</label><br>
      <input name="sales_tax_rate" type="number" min="0" max="100" step="0.01" placeholder="Enter rate" value="0">
    </p>

    <p>
      <label>Pay schedule</label><br>
      <select name="pay_schedule">
        <option value="">Choose a schedule</option>
        <option value="weekly">Weekly</option>
        <option value="biweekly">Every two weeks</option>
        <option value="monthly">Monthly</option>
      </select>
    </p>

    <p>
      <label>Emergency savings</label><br>
      <input name="emergency_savings" type="number" min="0" step="0.01" placeholder="Current savings" value="0">
    </p>

    <button class="primary-button" type="submit">Save Income Details</button>
    <span id="income-status" style="margin-left: 10px;"></span>
  </form>
</section>

<section class="panel" style="margin-top: 16px;">
  <p class="label">EXPENSES</p>
  <h2>Recurring monthly expenses</h2>

  <div id="expense-list"><p>No expenses have been saved yet.</p></div>

  <form id="expense-form">
    <p>
      <label>Expense name</label><br>
      <input name="expense_name" type="text" placeholder="For example: housing, food, or utilities" required>
    </p>

    <p>
      <label>Expense category</label><br>
      <select name="expense_category" required>
        <option value="">Choose a category</option>
        <option>Housing</option>
        <option>Food</option>
        <option>Utilities</option>
        <option>Transportation</option>
        <option>Debt</option>
        <option>Subscriptions</option>
        <option>Other</option>
      </select>
    </p>

    <p>
      <label>Monthly amount</label><br>
      <input name="expense_amount" type="number" min="0" step="0.01" placeholder="Enter amount" required>
    </p>

    <p>
      <label>Usually due on</label><br>
      <input name="expense_due_day" type="number" min="1" max="28" step="1" placeholder="Day of month (optional)">
    </p>

    <button class="primary-button" type="submit">Add Expense</button>
  </form>
</section>

<script>
  const MONEY_KEY = "lifepath_money";
  const money = JSON.parse(localStorage.getItem(MONEY_KEY) || '{"income":{},"expenses":[]}');
  const incomeForm = document.getElementById("income-form");
  const expenseForm = document.getElementById("expense-form");
  const expenseList = document.getElementById("expense-list");

  function renderExpenses() {
    expenseList.replaceChildren();
    if (!money.expenses.length) {
      const empty = document.createElement("p");
      empty.textContent = "No expenses have been saved yet.";
      expenseList.appendChild(empty);
      return;
    }
    money.expenses.forEach((expense, index) => {
      const row = document.createElement("div");
      row.className = "spending-row";
      const label = document.createElement("span");
      label.textContent = `${expense.name} (${expense.category})${expense.due_day ? ` · due day ${expense.due_day}` : ""}`;
      const amount = document.createElement("strong");
      amount.textContent = `$${Number(expense.amount).toFixed(2)}`;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "light-button";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => removeExpense(index));
      row.append(label, amount, remove);
      expenseList.appendChild(row);
    });
  }

  function removeExpense(index) {
    money.expenses.splice(index, 1);
    localStorage.setItem(MONEY_KEY, JSON.stringify(money));
    renderExpenses();
  }

  Object.entries(money.income || {}).forEach(([name, value]) => {
    if (incomeForm.elements[name]) incomeForm.elements[name].value = value;
  });

  incomeForm.addEventListener("submit", (event) => {
    event.preventDefault();
    money.income = Object.fromEntries(new FormData(incomeForm).entries());
    localStorage.setItem(MONEY_KEY, JSON.stringify(money));
    document.getElementById("income-status").textContent = "Saved on this device.";
  });

  expenseForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(expenseForm).entries());
    money.expenses.push({
      name: values.expense_name,
      category: values.expense_category,
      amount: Number(values.expense_amount),
      due_day: values.expense_due_day ? Number(values.expense_due_day) : null,
      essential: ["Housing", "Food", "Utilities", "Transportation", "Debt"].includes(values.expense_category),
    });
    localStorage.setItem(MONEY_KEY, JSON.stringify(money));
    expenseForm.reset();
    renderExpenses();
  });

  renderExpenses();
</script>
{% endblock %}
